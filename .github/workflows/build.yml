      fail-fast: false
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Go
      if: ${{ matrix.jobs.goversion == '' }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
        go-version: '1.26'
    - name: Set up Go
      if: ${{ matrix.jobs.goversion != '' && matrix.jobs.goversion != 'custom' }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
        go-version: ${{ matrix.jobs.goversion }}
    - name: Set up Go1.26 loongarch abi1
      if: ${{ matrix.jobs.goarch == 'loong64' && matrix.jobs.abi == '1' }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: https://github.com/MetaCubeX/loongarch64-golang/releases/download/1.26.0
        go-version: 1.26.0
    - name: Verify Go installation
      run: go version
    - name: Verify Go env
      run: go env
    - name: Set fork version
      run: python3 .fork/fork.py env
    - name: Setup NDK
      if: ${{ matrix.jobs.goos == 'android' }}
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29-beta1
    - name: Set NDK path
      if: ${{ matrix.jobs.goos == 'android' }}
      run: 'echo "CC=${{steps.setup-ndk.outputs.ndk-path}}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{matrix.jobs.ndk}}-clang"
        >> $GITHUB_ENV

        echo "CGO_ENABLED=1" >> $GITHUB_ENV

        echo "BUILDTAG=" >> $GITHUB_ENV

        '
    - name: Test
      if: ${{ matrix.jobs.test == 'test' }}
      run: 'export SKIP_CONCURRENT_TEST=1

        export SKIP_INTEROP_TEST=1

        go test ./...

        echo "---test with_gvisor---"

        go test ./... -tags "with_gvisor" -count=1

        '
    - name: Update CA
      run: 'sudo apt-get update && sudo apt-get install ca-certificates

        sudo update-ca-certificates

        cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

        '
    - name: Build Android system DNS helper
      if: ${{ matrix.jobs.goos == 'android' }}
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

        python3 component/systemdns/test_observer.py

        python3 component/systemdns/build.py

        '
    - name: Build core
      env:
        GOOS: ${{matrix.jobs.goos}}
        GOARCH: ${{matrix.jobs.goarch}}
        GOAMD64: ${{matrix.jobs.goamd64}}
        GO386: ${{matrix.jobs.go386}}
        GOARM: ${{matrix.jobs.goarm}}
        GOMIPS: ${{matrix.jobs.gomips}}
      run: "go env\ngo build -v -tags \"with_gvisor\" -trimpath -ldflags \"${BUILDTAG} -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}'\
        \ -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid=\"\nif [ \"${{matrix.jobs.goos}}\"\
        \ = \"windows\" ]; then\n  cp mihomo.exe mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}.exe\n  zip -r mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}-${VERSION}.zip\
        \ mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}.exe\nelse\n  cp mihomo mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}\n\
        \  gzip -c mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}} > mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}-${VERSION}.gz\n\
        \  rm mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}\nfi\n"
    - name: Package DEB
      if: matrix.jobs.debian != ''
      run: "set -xeuo pipefail\nsudo gem install fpm\ncp .github/release/.fpm_systemd .fpm\n\nfpm -t deb \\\n  -v \"${PackageVersion}\"\
        \ \\\n  -p \"mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}-${VERSION}.deb\" \\\n  --architecture ${{ matrix.jobs.debian\
        \ }} \\\n  mihomo=/usr/bin/mihomo\n"
    - name: Package RPM
      if: matrix.jobs.rpm != ''
      run: "set -xeuo pipefail\nsudo gem install fpm\ncp .github/release/.fpm_systemd .fpm\n\nfpm -t rpm \\\n  -v \"${PackageVersion}\"\
        \ \\\n  -p \"mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}-${VERSION}.rpm\" \\\n  --architecture ${{ matrix.jobs.rpm\
        \ }} \\\n  mihomo=/usr/bin/mihomo\n"
    - name: Package Pacman
      if: matrix.jobs.pacman != ''
      run: "set -xeuo pipefail\nsudo gem install fpm\nsudo apt-get update && sudo apt-get install -y libarchive-tools\ncp\
        \ .github/release/.fpm_systemd .fpm\n\nfpm -t pacman \\\n  -v \"${PackageVersion}\" \\\n  -p \"mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}-${VERSION}.pkg.tar.zst\"\
        \ \\\n  --architecture ${{ matrix.jobs.pacman }} \\\n  mihomo=/usr/bin/mihomo\n"
    - name: Pack Golang Toolchain
      if: ${{ matrix.jobs.goversion == '' && matrix.jobs.tarball == 'tarball' }}
      run: 'mkdir -p $GITHUB_WORKSPACE/toolchain/go

        cp -r $(go env GOROOT)/* $GITHUB_WORKSPACE/toolchain/go/

        cd $GITHUB_WORKSPACE/toolchain/

        tar -czf $GITHUB_WORKSPACE/toolchain.tar.gz .

        rm -rf $GITHUB_WORKSPACE/toolchain

        '
    - name: Pack GoMod Vendor
      if: ${{ matrix.jobs.goversion == '' && matrix.jobs.tarball == 'tarball' }}
      run: 'go mod vendor

        tar -czf $GITHUB_WORKSPACE/vendor.tar.gz vendor

        '
    - name: Save version
      run: 'echo ${VERSION} > version.txt

        '
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}
        path: 'mihomo*.gz

          mihomo*.deb

          mihomo*.rpm

          mihomo*.pkg.tar.zst

          mihomo*.zip

          toolchain.tar.gz

          vendor.tar.gz

          version.txt

          checksums.txt

          '
        if-no-files-found: error
        retention-days: 3
    permissions:
      contents: read
    timeout-minutes: 60
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
    - uses: actions/download-artifact@v8
      with:
        path: bin
        merge-multiple: true
    - name: Publish verified artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONUNBUFFERED: '1'
      run: python3 .fork/fork.py publish
