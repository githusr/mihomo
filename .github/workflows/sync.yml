name: Sync upstream
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: fork-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_DEPLOY_KEY }}
      - name: Install workflow parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check automation
        run: python3 -m unittest discover -s tests -v
      - name: Sync, build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/fork.py sync

